spring:
  application:
    name: relay-shop
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/postgres
    username: postgres
    password: postgres
  sql:
    init:
      mode: never

ledger-relay:
  worker:
    concurrency: 2
    batch-size: 4
    max-in-flight: 64
    lease-duration: 10s
    submit-timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

shop:
  instance-name: ${HOSTNAME:shop}
