spring:
  application:
    name: relay-shop
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/postgres
    username: postgres
    password: postgres
  sql:
    init:
      mode: never

ledger-relay:
  worker:
    concurrency: 2
    batch-size: 4
    max-in-flight: 64
    lease-duration: 10s
    submit-timeout: 2s
  # The retry interval grows while TB is unreachable. With the library default maximum (30 s), the backlog can wait up to 30 s after the connection returns before it drains.
  # The demo keeps it short so that the backlog visibly drains right after the connection is restored
  backoff:
    initial: 200ms
    max: 2s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

shop:
  instance-name: ${HOSTNAME:shop}
