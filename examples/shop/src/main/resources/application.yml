spring:
  application:
    name: relay-shop
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/postgres
    username: postgres
    password: postgres
  sql:
    init:
      mode: never

ledger-relay:
  worker:
    concurrency: 2
    batch-size: 4
    max-in-flight: 64
    lease-duration: 10s
    submit-timeout: 2s
  # TB가 끊긴 동안 재시도 간격이 늘어난다. 라이브러리 기본 최대(30초)면 다시 이은 뒤 대기가 비기까지 30초를 기다리게 된다.
  # 데모에서는 이으면 곧 비워지는 것이 보이도록 짧게 둔다
  backoff:
    initial: 200ms
    max: 2s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

shop:
  instance-name: ${HOSTNAME:shop}
