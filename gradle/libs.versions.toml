[versions]
tigerbeetle = "0.17.9"
testcontainers = "2.0.5"
junit = "6.1.3"
assertj = "3.27.7"
slf4j = "2.0.20"
archunit = "1.5.1"
spring = "7.0.9"
postgresql = "42.7.14"
hikaricp = "7.1.0"
hibernate = "7.4.13.Final"

[libraries]
tigerbeetle-java = { module = "com.tigerbeetle:tigerbeetle-java", version.ref = "tigerbeetle" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-toxiproxy = { module = "org.testcontainers:testcontainers-toxiproxy", version.ref = "testcontainers" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
spring-jdbc = { module = "org.springframework:spring-jdbc", version.ref = "spring" }
spring-tx = { module = "org.springframework:spring-tx", version.ref = "spring" }
spring-orm = { module = "org.springframework:spring-orm", version.ref = "spring" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
hibernate-core = { module = "org.hibernate.orm:hibernate-core", version.ref = "hibernate" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
