# ledger-relay sample shop demo. You only need Docker.
#   docker compose up --build   →   http://localhost:8090
# Shut down: docker compose down   (the demo starts from an empty DB and an empty ledger each time)
# Stopping and starting again (up after Ctrl-C, stop/start) continues both as they were. PG and TB always stay
# together and go away together.
# Putting only one of them in a named volume leaves only the ledger after down, and the screen shows false
# duplicate transfers (docs/failure-modes.md F44)
#
#   browser → shop-a (UI, API, worker) ┐
#             shop-b (worker)          ┴→ PostgreSQL
#                                      → Toxiproxy (cut-off switch of scene 2) → TigerBeetle
#
# PG, TB and Toxiproxy open no host ports. With the TB port closed, the cause of the panic right after startup
# (docs/failure-modes.md F26) has no path either.

x-shop: &shop
  image: ledger-relay-shop:local
  depends_on:
    postgres:
      condition: service_healthy
    toxiproxy:
      condition: service_started
    tigerbeetle:
      condition: service_started
  # The TB Java client uses io_uring too. With the default seccomp profile it dies while creating the Client
  # (docs/failure-modes.md F41)
  security_opt:
    - seccomp=unconfined
  mem_limit: 640m
  restart: on-failure
  environment: &shop-env
    SPRING_PROFILES_ACTIVE: demo
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shop
    SPRING_DATASOURCE_USERNAME: shop
    SPRING_DATASOURCE_PASSWORD: shop
    SHOP_TIGERBEETLE_ADDRESS: toxiproxy:3001
    SHOP_DEMO_TOXIPROXY_URL: http://toxiproxy:8474
    LEDGER_RELAY_WORKER_CONCURRENCY: "2"
    LEDGER_RELAY_WORKER_BATCH_SIZE: "4"
    LEDGER_RELAY_WORKER_MAX_IN_FLIGHT: "64"
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shop", "-d", "shop"]
      interval: 2s
      timeout: 3s
      retries: 30

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    # TB uses io_uring. It does not start with Docker's default seccomp profile
    security_opt:
      - seccomp=unconfined
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /data &&
        { [ -f /data/0_0.tigerbeetle ] ||
          /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 --development /data/0_0.tigerbeetle; } &&
        exec /tigerbeetle start --addresses=0.0.0.0:3000 --development --cache-grid=128MiB /data/0_0.tigerbeetle
    restart: on-failure

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./examples/shop/compose/toxiproxy.json:/config/toxiproxy.json:ro

  # Only shop-a builds the image. If both build under the same name, the one that finishes at the same moment
  # fails with "already exists" (F42)
  shop-a:
    <<: *shop
    build:
      context: .
      dockerfile: examples/shop/Dockerfile
    environment:
      <<: *shop-env
      SHOP_INSTANCE_NAME: shop-a
    ports:
      - "${SHOP_PORT:-8090}:8080"

  shop-b:
    <<: *shop
    pull_policy: never
    environment:
      <<: *shop-env
      SHOP_INSTANCE_NAME: shop-b
